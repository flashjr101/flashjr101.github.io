<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#eceff3;--ink:#1b2332;--mute:#5a6475;--panel:#fff;--line:#d3d9e2;--acc:#e3a62a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161e;--ink:#e8ecf2;--mute:#97a2b5;--panel:#1b212c;--line:#2d3544;--acc:#e8b13d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161e;--ink:#e8ecf2;--mute:#97a2b5;--panel:#1b212c;--line:#2d3544;--acc:#e8b13d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center}
main{width:100%;max-width:640px;padding:24px 16px}
h1{font-size:1.9rem;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{display:grid;gap:6px;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer}
.card:hover{border-color:var(--acc)}
.card:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.card .ic{font-size:2rem;line-height:1}
.card b{font-size:1.25rem;font-weight:800}
.card span{color:var(--mute);font-size:.92rem}
</style>
</head>
<body>
<main>
  <h1>What do you want to train?</h1>
  <p class="sub">Pick one. Use the Menu button inside either trainer to come back here.</p>
  <div class="cards">
    <button class="card" type="button" data-app="chess"><div class="ic">♞</div><b>Chess</b><span>Coordinates, files and ranks, square colors and diagonals.</span></button>
    <button class="card" type="button" data-app="vocab"><div class="ic">📚</div><b>Vocabulary</b><span>Learn words by meaning, with pronunciation and word forms.</span></button>
  </div>
</main>
<script>
const APPS={chess:"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Chess Coordinate Trainer<\/title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap\">\n<style>\n:root{--bg:#eceff3;--ink:#1b2332;--mute:#5a6475;--panel:#fff;--line:#d3d9e2;--lt:#e4e9f0;--dk:#6f87a8;--acc:#e3a62a;--ok:#2f9e6b;--bad:#d1495b;\nbox-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#12161e;--ink:#e8ecf2;--mute:#97a2b5;--panel:#1b212c;--line:#2d3544;--lt:#c9d1de;--dk:#4d6384;--acc:#e8b13d;color-scheme:dark}}\n:root[data-theme=\"dark\"]{--bg:#12161e;--ink:#e8ecf2;--mute:#97a2b5;--panel:#1b212c;--line:#2d3544;--lt:#c9d1de;--dk:#4d6384;--acc:#e8b13d;color-scheme:dark}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 \"Bricolage Grotesque\",system-ui,-apple-system,\"Segoe UI\",sans-serif}\nmain{max-width:980px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}\n@media(min-width:860px){main{grid-template-columns:minmax(0,560px) 1fr;align-items:start}}\nh1{font-size:1.5rem;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}\n.sub{color:var(--mute);margin:0 0 14px}\n.stats{display:flex;gap:18px;margin-bottom:10px;font-variant-numeric:tabular-nums}\n.stats div{display:flex;flex-direction:column}\n.stats b{font-size:1.35rem;font-weight:800;line-height:1.1}\n.stats span{font-size:.8rem;color:var(--mute)}\n.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:12px}\n.bar i{display:block;height:100%;width:100%;background:var(--acc);transition:width .1s linear}\n.prompt{font-size:2.6rem;font-weight:800;letter-spacing:-.02em;min-height:3.3rem;margin-bottom:8px}\n.prompt small{font-size:1rem;font-weight:400;color:var(--mute);display:block;letter-spacing:0}\n#board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;width:100%;border-radius:6px;overflow:hidden;border:1px solid var(--line);user-select:none}\n.sq{position:relative;border:0;padding:0;margin:0;background:var(--lt);cursor:pointer;font:inherit}\n.sq.d{background:var(--dk)}\n.sq:focus-visible{outline:3px solid var(--acc);outline-offset:-3px;z-index:2}\n.sq.dg::after{content:\"\";position:absolute;inset:0;background:var(--ok);opacity:.6}\n.sq.hl::after{content:\"\";position:absolute;inset:0;background:var(--acc);opacity:.7}\n.sq.one::after{opacity:.95}\n.sq.ok::after{content:\"\";position:absolute;inset:0;background:var(--ok);opacity:.85}\n.sq.bad::after{content:\"\";position:absolute;inset:0;background:var(--bad);opacity:.85}\n.sq em{position:absolute;font:600 .7rem/1 inherit;font-style:normal;color:var(--dk);z-index:1}\n.sq.d em{color:var(--lt)}\n.sq em.r{top:4px;left:4px}.sq em.f{bottom:4px;right:4px}\n.keys{display:grid;gap:6px;margin-top:12px}\n.keys div{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}\n.keys button{padding:10px 0;font:600 1.05rem inherit;font-family:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer}\n.keys button:disabled{opacity:.35;cursor:default}\n.keys button:focus-visible,.seg button:focus-visible,.go:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px}\n.grp>label{display:block;font-size:.9rem;font-weight:600;margin-bottom:6px}\n.seg{display:flex;flex-wrap:wrap;gap:6px}\n.seg button{font:inherit;font-size:.92rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}\n.seg button[aria-pressed=\"true\"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}\n.hint{font-size:.85rem;color:var(--mute);margin:6px 0 0}\n.go{font:800 1.1rem inherit;font-family:inherit;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#1b2332;cursor:pointer}\n.chk{display:flex;gap:8px;align-items:center;font-size:.92rem}\n#over{position:absolute;inset:0;display:none;place-items:center;background:rgba(18,22,30,.78);color:#fff;text-align:center;z-index:5;padding:16px}\n#over.show{display:grid}\n#over h2{margin:0 0 4px;font-size:2.2rem;font-weight:800}\n#over p{margin:2px 0}\n#over .go{margin-top:14px;padding:10px 22px}\n.wrap{position:relative}\n#colorUI{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;z-index:3}\n#colorUI[hidden]{display:none}\n.cb{border-radius:8px;border:2px solid var(--line);font:800 1.7rem/1.1 inherit;font-family:inherit;cursor:pointer;display:grid;place-content:center;gap:6px}\n.cb small{font-size:.95rem;font-weight:600;opacity:.75}\n.cb.d{background:var(--dk);color:#fff}.cb.w{background:var(--lt);color:#1b2332}\n.cb:focus-visible{outline:3px solid var(--acc);outline-offset:3px}\n.cb.ok{outline:6px solid var(--ok)}.cb.bad{outline:6px solid var(--bad)}\n#dKeys{margin-top:12px;display:grid;gap:10px}#dKeys[hidden]{display:none}\n.dinfo{min-height:1.4em;font-weight:600}\n.dgrp span{display:block;font-size:.8rem;color:var(--mute);margin-bottom:4px}\n.dgrp div{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}\n.dgrp button{padding:9px 4px;font:600 .95rem inherit;font-family:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;cursor:pointer}\n.dgrp button.on{background:var(--ok);color:#fff;border-color:var(--ok)}\n.dgrp button.bad{outline:3px solid var(--bad)}\n.dgrp button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}\n@media (prefers-reduced-motion:reduce){.bar i{transition:none}}\n<\/style>\n<\/head>\n<body>\n<main>\n<section aria-label=\"Trainer\">\n  <h1>Coordinate trainer<\/h1>\n  <p class=\"sub\">Learn to read the board without looking at the labels.<\/p>\n  <div class=\"stats\" aria-live=\"off\">\n    <div><b id=\"sScore\">0<\/b><span>Correct<\/span><\/div>\n    <div><b id=\"sStreak\">0<\/b><span>Streak<\/span><\/div>\n    <div><b id=\"sAcc\">–<\/b><span>Accuracy<\/span><\/div>\n    <div><b id=\"sTime\">–<\/b><span>Time left<\/span><\/div>\n  <\/div>\n  <div class=\"bar\"><i id=\"bar\"><\/i><\/div>\n  <div class=\"prompt\" id=\"promptText\" aria-live=\"polite\">Press Start<\/div>\n  <div id=\"viewTag\" style=\"margin:-4px 0 8px;font-weight:600;color:var(--mute);min-height:1.4em\"><\/div>\n  <button type=\"button\" id=\"rep\" hidden style=\"margin:-2px 0 10px;font:inherit;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer\">Hear again (R)<\/button>\n  <div class=\"wrap\">\n    <div id=\"board\" role=\"grid\" aria-label=\"Chess board\"><\/div>\n    <div id=\"colorUI\" hidden><button type=\"button\" class=\"cb d\" id=\"cD\">Dark<small>press B<\/small><\/button><button type=\"button\" class=\"cb w\" id=\"cW\">White<small>press W<\/small><\/button><\/div>\n    <div id=\"over\"><div><h2 id=\"oTitle\">Time<\/h2><p id=\"oBody\"><\/p><p id=\"oBest\"><\/p><button class=\"go\" id=\"again\">Play again<\/button><\/div><\/div>\n  <\/div>\n  <div id=\"dKeys\" hidden><div class=\"dinfo\" id=\"dInfo\" aria-live=\"polite\"><\/div><div class=\"dgrp\"><span>Rising diagonals (↗)<\/span><div id=\"dA\"><\/div><\/div><div class=\"dgrp\"><span>Falling diagonals (↘)<\/span><div id=\"dB\"><\/div><\/div><\/div>\n  <div class=\"keys\" id=\"keys\" hidden>\n    <div id=\"kF\"><\/div>\n    <div id=\"kR\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"panel\" aria-label=\"Settings\">\n  <div class=\"grp\"><label>Diagonal colors (Diagonals mode)<\/label><div class=\"seg\" id=\"dcolor\"><\/div><\/div>\n  <div class=\"grp\"><label>Chess board in Diagonals mode<\/label><div class=\"seg\" id=\"dboard\"><\/div><\/div>\n  <div class=\"grp\"><label>Train<\/label><div class=\"seg\" id=\"scope\"><\/div>\n    <p class=\"hint\" id=\"scopeHint\"><\/p><\/div>\n  <div class=\"grp\"><label>Answer by<\/label><div class=\"seg\" id=\"mode\"><\/div>\n    <p class=\"hint\" id=\"modeHint\"><\/p><\/div>\n  <div class=\"grp\"><label>Round length<\/label><div class=\"seg\" id=\"time\"><\/div><\/div>\n  <div class=\"grp\"><label>Board view<\/label><div class=\"seg\" id=\"orient\"><\/div><\/div>\n  <div class=\"grp\"><label>Correct-answer sound<\/label><div class=\"seg\" id=\"sound\"><\/div><\/div>\n  <div class=\"grp\"><label>Wrong-answer sound<\/label><div class=\"seg\" id=\"wrong\"><\/div><\/div>\n  <div class=\"grp\"><label>Call out the target aloud (Click it and Square color modes)<\/label><div class=\"seg\" id=\"prompt\"><\/div>\n    <p class=\"hint\">The app says the square, column or row at full volume. Press R to hear it again.<\/p><\/div>\n  <div class=\"grp\"><label>Say “White view” or “Black view” aloud<\/label><div class=\"seg\" id=\"viewsay\"><\/div><\/div>\n  <div class=\"grp\"><label>Speak the name after a correct answer<\/label><div class=\"seg\" id=\"speak\"><\/div><\/div>\n  <label class=\"chk\"><input type=\"checkbox\" id=\"coords\"> Show coordinate labels on the board<\/label>\n  <button class=\"go\" id=\"start\">Start<\/button>\n  <p class=\"hint\">Keyboard: in “Name it” mode type the letter and number (for example <b>e<\/b> then <b>4<\/b>). Esc ends the round.<\/p>\n<\/section>\n<\/main>\n\n<\script>\nconst F='abcdefgh';\nconst $=s=>document.querySelector(s);\nconst CFG={\n  scope:{opts:[['squares','Squares'],['files','Columns (files)'],['ranks','Rows (ranks)'],['lines','Rows + columns']],\n    hint:{squares:'Individual squares like e4.',files:'Only the columns a to h.',ranks:'Only the rows 1 to 8.',lines:'Randomly mixes columns and rows.'}},\n  mode:{opts:[['find','Click it'],['name','Name it'],['color','Square color'],['diag','Diagonals']],\n    hint:{find:'You get a name, then click it on the board.',name:'The board highlights something, then you name it.',diag:'A square appears. Pick the diagonals that pass through it (two, or just one for a corner). Squares only, so the Train setting does not apply.',color:'A square like a4 appears and you choose Dark or White (keys B and W). The board is hidden. Squares only, so the Train and view settings don\\u2019t apply.'}},\n  dboard:{opts:[['on','Show board'],['off','Hide board']]},\n  dcolor:{opts:[['both','Both colors'],['dark','Dark only'],['light','White only']]},\n  time:{opts:[[30,'30 s'],[60,'60 s'],[0,'No limit']]},\n  orient:{opts:[['white','White'],['black','Black'],['random','Random']]},\n  sound:{opts:[['on','On'],['off','Off']]},\n  wrong:{opts:[['buzz','Buzz'],['silent','Silent']]},\n  speak:{opts:[['on','On'],['off','Off']]},\n  prompt:{opts:[['on','On'],['off','Off']]},\n  viewsay:{opts:[['off','Off'],['on','On']]}\n};\nlet S={scope:'squares',mode:'find',time:30,orient:'white',sound:'on',wrong:'buzz',speak:'on',prompt:'on',viewsay:'off',dcolor:'both',dboard:'on'};\ntry{const s=JSON.parse(localStorage.getItem('ctSettings')||'null');if(s)S=Object.assign(S,s)}catch(e){}\nlet run=null,view='white',cells={};\n\nfunction seg(id){\n  const el=$('#'+id);el.innerHTML='';\n  CFG[id].opts.forEach(([v,l])=>{\n    const b=document.createElement('button');b.type='button';b.textContent=l;\n    b.setAttribute('aria-pressed',String(S[id]==v));\n    b.onclick=()=>{S[id]=v;save();segs();\n      if(id==='sound'||id==='wrong'||id==='speak'||id==='prompt'||id==='viewsay'){\n        if(id==='viewsay'){v==='on'?shout(null,'black view'):stopSpeech()}\n        if(id==='prompt'){v==='on'?shout({type:'file',f:2,r:1}):stopSpeech()}\n        if(id==='sound'&&v==='on')beep('ok');\n        if(id==='wrong'&&v==='buzz')beep('bad');\n        if(id==='speak'){v==='on'?speak('ee four'):stopSpeech()}\n        return}\n      if(run)end(true);view=S.orient==='black'?'black':'white';buildBoard();idle()};\n    el.appendChild(b);\n  });\n  const h=$('#'+id+'Hint');if(h&&CFG[id].hint)h.textContent=CFG[id].hint[S[id]];\n}\nfunction segs(){['scope','mode','time','orient','sound','wrong','speak','prompt','viewsay','dcolor','dboard'].forEach(seg)}\nfunction save(){try{localStorage.setItem('ctSettings',JSON.stringify(Object.assign({},S,{coords:$('#coords').checked})))}catch(e){}}\nfunction bestKey(){return `ctBest:${S.scope}:${S.mode}:${S.time}`}\n\nfunction buildBoard(){\n  const b=$('#board');b.innerHTML='';cells={};\n  const ranks=view==='white'?[8,7,6,5,4,3,2,1]:[1,2,3,4,5,6,7,8];\n  const files=view==='white'?[0,1,2,3,4,5,6,7]:[7,6,5,4,3,2,1,0];\n  const show=$('#coords').checked;\n  ranks.forEach((r,ri)=>files.forEach((f,fi)=>{\n    const c=document.createElement('button');c.type='button';\n    c.className='sq'+((f+r)%2===0?'':' d');\n    c.dataset.f=f;c.dataset.r=r;\n    c.setAttribute('aria-label','Square');\n    if(show){\n      if(fi===0)c.insertAdjacentHTML('beforeend',`<em class=\"r\">${r}<\/em>`);\n      if(ri===7)c.insertAdjacentHTML('beforeend',`<em class=\"f\">${F[f]}<\/em>`);\n    }\n    c.onclick=()=>clickSq(f,r);\n    b.appendChild(c);cells[f+','+r]=c;\n  }));\n}\nfunction clearHl(){Object.values(cells).forEach(c=>c.classList.remove('hl','one','dg'))}\nfunction flash(list,cls){list.forEach(c=>{c.classList.add(cls);setTimeout(()=>c.classList.remove(cls),350)})}\nfunction cellsFor(t){\n  if(t.type==='sq')return [cells[t.f+','+t.r]];\n  if(t.type==='file')return [1,2,3,4,5,6,7,8].map(r=>cells[t.f+','+r]);\n  return [0,1,2,3,4,5,6,7].map(f=>cells[f+','+t.r]);\n}\nfunction label(t){return t.type==='sq'?F[t.f]+t.r:t.type==='file'?'File '+F[t.f]:'Rank '+t.r}\n\nfunction newTarget(){\n  let t,tries=0;\n  do{\n    let type=S.mode==='color'||S.mode==='diag'||S.scope==='squares'?'sq':S.scope==='files'?'file':S.scope==='ranks'?'rank':(Math.random()<.5?'file':'rank');\n    t={type,f:Math.floor(Math.random()*8),r:1+Math.floor(Math.random()*8)};\n  }while((run.t&&label(t)===label(run.t)&&++tries<20)||(S.mode==='diag'&&!dOK(t)));\n  run.t=t;run.got={};\n  if(S.orient==='random'&&S.mode!=='color'){view=Math.random()<.5?'white':'black';buildBoard()}\n  run.say=(S.viewsay==='on'&&(S.orient==='random'||run.first))?view+' view. ':'';\n  run.first=false;\n  $('#viewTag').innerHTML=S.mode==='color'?'':viewHtml();\n  clearHl();\n  if(S.mode==='diag'){\n    cellsFor(t).forEach(c=>c.classList.add('hl','one'));\n    run.dneed=diagsOf(t.f,t.r);run.dgot={};\n    $('#promptText').innerHTML=label(t)+'<small>'+(isCorner(t)?'Pick a diagonal through this corner (one is enough)':'Pick the two diagonals through this square')+'<\/small>';\n    $('#dInfo').textContent='';\n    if(S.prompt==='on')shout(t,run.say);\n  }else if(S.mode==='color'){\n    $('#promptText').innerHTML=label(t)+'<small>Is this square dark or light?<\/small>';\n    if(S.prompt==='on')shout(t,'');\n  }else if(S.mode==='name'){\n    cellsFor(t).forEach(c=>c.classList.add('hl',t.type==='sq'?'one':'hl'));\n    $('#promptText').innerHTML='?<small>Name the highlighted '+(t.type==='sq'?'square':t.type==='file'?'column':'row')+'<\/small>';\n    if(S.prompt==='on'&&run.say)shout(null,run.say);\n  }else{\n    $('#promptText').innerHTML=label(t)+'<small>Click '+(t.type==='sq'?'this square':t.type==='file'?'any square in this column':'any square in this row')+'<\/small>';\n    if(S.prompt==='on')shout(t,run.say);\n  }\n  updateKeys();\n}\nfunction updateKeys(){\n  const t=run&&run.t;\n  $('#keys').hidden=!(run&&S.mode==='name');$('#rep').hidden=!(run&&(S.mode==='find'||S.mode==='color'||S.mode==='diag'));syncColor();\n  if(!t)return;\n  $('#kF').querySelectorAll('button').forEach(b=>b.disabled=t.type==='rank');\n  $('#kR').querySelectorAll('button').forEach(b=>b.disabled=t.type==='file');\n}\nfunction buildKeys(){\n  const kf=$('#kF'),kr=$('#kR');kf.innerHTML=kr.innerHTML='';\n  for(let i=0;i<8;i++){\n    let a=document.createElement('button');a.type='button';a.textContent=F[i];a.onclick=()=>type(F[i]);kf.appendChild(a);\n    let b=document.createElement('button');b.type='button';b.textContent=i+1;b.onclick=()=>type(String(i+1));kr.appendChild(b);\n  }\n}\n\nfunction right(cellsToFlash){\n  if(S.sound==='on')beep('ok');\n  if(S.speak==='on'&&(S.mode==='name'||S.prompt==='off'))speak(sayText(run.t));\n  run.ok++;run.streak++;run.bestStreak=Math.max(run.bestStreak,run.streak);\n  flash(cellsToFlash,'ok');stats();newTarget();\n}\nfunction wrong(cellsToFlash){\n  if(S.sound==='on'&&S.wrong==='buzz')beep('bad');\n  run.miss++;run.streak=0;flash(cellsToFlash,'bad');stats();\n  if(S.mode==='name'){run.got={};}\n}\nfunction clickSq(f,r){\n  if(!run||S.mode!=='find')return;\n  const t=run.t,c=cells[f+','+r];\n  const ok=t.type==='sq'?(f===t.f&&r===t.r):t.type==='file'?f===t.f:r===t.r;\n  ok?right([c]):wrong([c]);\n}\nfunction type(ch){\n  if(!run||S.mode!=='name')return;\n  const t=run.t;ch=ch.toLowerCase();\n  const isF=/^[a-h]$/.test(ch),isR=/^[1-8]$/.test(ch);\n  if(!isF&&!isR)return;\n  if(t.type==='file'&&!isF||t.type==='rank'&&!isR)return;\n  if(isF)run.got.f=F.indexOf(ch);else run.got.r=+ch;\n  const g=run.got;\n  if(t.type==='sq'){\n    $('#promptText').innerHTML=(g.f!=null?F[g.f]:'_')+(g.r!=null?g.r:'_')+'<small>Name the highlighted square<\/small>';\n    if(g.f==null||g.r==null)return;\n    (g.f===t.f&&g.r===t.r)?right(cellsFor(t)):wrong(cellsFor(t));\n    if(run&&run.t===t)$('#promptText').innerHTML='?<small>Try again<\/small>';\n  }else if(t.type==='file'){\n    g.f===t.f?right(cellsFor(t)):wrong(cellsFor(t));\n  }else{\n    g.r===t.r?right(cellsFor(t)):wrong(cellsFor(t));\n  }\n}\ndocument.addEventListener('keydown',e=>{\n  if(e.ctrlKey||e.metaKey||e.altKey)return;\n  if(e.key==='Escape'&&run){end(false);return}\n  if(run&&S.mode==='name'&&e.key.length===1){type(e.key)}\n  if(run&&S.mode==='diag'&&e.key.toLowerCase()==='r'&&run.t)shout(run.t,'');\n  i
