<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vocabulary Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#eceff3;--ink:#1b2332;--mute:#5a6475;--panel:#fff;--line:#d3d9e2;--acc:#e3a62a;--ok:#2f9e6b;--bad:#d1495b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161e;--ink:#e8ecf2;--mute:#97a2b5;--panel:#1b212c;--line:#2d3544;--acc:#e8b13d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161e;--ink:#e8ecf2;--mute:#97a2b5;--panel:#1b212c;--line:#2d3544;--acc:#e8b13d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;font-weight:800;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 14px}
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:16px}
.grp>label{display:block;font-size:.9rem;font-weight:600;margin-bottom:6px}
.grp>label span{font-weight:400;color:var(--mute)}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg+.seg{margin-top:6px}
.seg button,.mini{font:inherit;font-size:.92rem;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
#gsel button{min-width:44px;padding:7px 0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.hint{font-size:.85rem;color:var(--mute);margin:6px 0 0}
.go{font:800 1.05rem inherit;font-family:inherit;padding:12px 20px;border:0;border-radius:10px;background:var(--acc);color:#1b2332;cursor:pointer}
.go:disabled{opacity:.45;cursor:default}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}.stats b{font-size:1.25rem;font-weight:800;line-height:1.1}.stats span{font-size:.78rem;color:var(--mute)}
.acts{display:flex;gap:6px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.lab{font-size:.85rem;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.big{font-size:1.7rem;font-weight:800;line-height:1.25;letter-spacing:-.01em}
.big.w{font-size:2.6rem}
.note{font-size:.88rem;color:var(--mute);min-height:1.2em}
input[type=text]{font:inherit;font-size:1.1rem;width:100%;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input.bad{border-color:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.row .go{padding:10px 18px}
#fb{margin-top:8px;min-height:1.4em;color:var(--mute);font-size:.95rem}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;align-items:flex-start}
.opt kbd{font:600 .8rem inherit;font-family:inherit;min-width:1.4rem;height:1.4rem;border-radius:5px;background:var(--line);display:grid;place-items:center;flex:none;margin-top:1px}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.ok kbd{background:rgba(255,255,255,.3)}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;opacity:.85}.opt.bad kbd{background:rgba(255,255,255,.3)}
.opt:disabled{cursor:default}
.rv{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
.rw{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.rw b{font-size:2rem;font-weight:800;letter-spacing:-.01em}
.rv ol{margin:0;padding-left:1.3rem}.rv ol.one{list-style:none;padding-left:0}
.forms{display:flex;flex-wrap:wrap;gap:8px}
.forms span{font-size:.9rem;border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.forms em{font-style:normal;color:var(--mute);margin-right:6px;font-size:.8rem}
.rn{font-size:.88rem;color:var(--mute)}
@media (prefers-reduced-motion:reduce){input.bad{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<main>
<section id="setup">
  <h1>Vocabulary trainer</h1>
  <p class="sub">32 groups, 960 words, with meanings and word forms.</p>
  <div class="panel">
    <div class="grp"><label>Groups <span id="cnt"></span></label><div class="seg" id="gsel"></div><div class="seg" id="gpre"></div></div>
    <div class="grp"><label>Training type</label><div class="seg" id="mode"></div><p class="hint" id="mhint"></p></div>
    <div class="grp"><label>Say words aloud</label><div class="seg" id="speak"></div><p class="hint" id="shint"></p></div>
    <button class="go" id="start">Start</button>
  </div>
</section>

<section id="quiz" hidden>
  <div class="top">
    <div class="stats">
      <div><b id="sOk">0</b><span>First try</span></div>
      <div><b id="sStreak">0</b><span>Streak</span></div>
      <div><b id="sAcc">–</b><span>Accuracy</span></div>
      <div><b id="sProg">0/0</b><span id="sRound">Word</span></div>
    </div>
    <div class="acts"><button class="mini" id="vc" type="button"></button><button class="mini" id="back" type="button">Settings</button></div>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card">
    <div class="lab" id="lab"></div>
    <div class="big" id="big"></div>
    <div class="note" id="note"></div>
    <div id="typeUI">
      <input id="inp" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Your answer" placeholder="Type the word">
      <div class="row"><button class="go" id="chk" type="button">Check</button><button class="mini" id="hintb" type="button">Hint</button><button class="mini" id="give" type="button">Show answer</button></div>
      <div id="fb" aria-live="polite"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="rv" id="rev" hidden>
      <div class="rw"><b id="rword"></b><button class="mini" id="hear" type="button">Hear it</button></div>
      <ol id="rm"></ol>
      <div class="forms" id="rf"></div>
      <div class="rn" id="rnote"></div>
      <div><button class="go" id="next" type="button">Next (Enter)</button></div>
    </div>
  </div>
</section>
</main>

or disagreement"],[[],[],[]]],["fallow",["(of farmland) not cultivated; barren","(of a period of time) inactive"],[[],[],[]]],["feint",["a deceptive movement or action"],[[],[],[]]],["flagrant",["noticeably offensive; blatant"],[[],[],[]]],["gratuitous",["unwarranted; without justification"],[[],[],[]]],["grovel",["show submission or fear; beg for favor"],[[],[],[]]],["indecorous",["not in good taste; inappropriate or unseemly"],[[],[],[]]],["intrigue",["a secret scheme or plot","provoke interest in"],[[],[],[]]],["nominal",["in name only","insubstantial; insignificant"],[[],[],[]]],["obdurate",["stubborn; unyielding"],[[],[],[]]],["obstreperous",["noisy, unruly, or hard to control"],[[],[],[]]],["odious",["highly offensive; repugnant"],[[],[],[]]],["plucky",["showing courage or determination"],[[],[],[]]],["precocious",["showing advanced skills or development earlier than usual"],[[],[],[]]],["remuneration",["payment or compensation for services or work"],[[],[],["remunerative"]]],["slovenly",["untidy, especially in personal appearance","without care; neglectful"],[[],[],[]]],["soliloquy",["a speech in a drama where a character talks to themselves, expressing inner thoughts"],[[],[],[]]],["spurn",["reject or refuse disdainfully"],[[],[],[]]],["stolid",["not easily moved or emotional"],[[],[],[]]],["temerity",["reckless boldness or audacity"],[[],[],[]]],["tenuous",["thin or weak"],[[],[],[]]],["verve",["energy, enthusiasm, or vigor"],[[],[],[]]]]},{"n":31,"w":[["abrogate",["formally cancel or do away with"],[[],[],[]]],["aghast",["shocked or horrified; struck with amazement"],[[],[],[]]],["apprise",["inform, notify, or advise"],[["apprisal"],[],[]]],["beguile",["charm or deceive in a captivating way"],[[],[],[]]],["boon",["a good thing; a blessing or a benefit"],[[],[],[]]],["callous",["emotionally unfeeling or insensitive"],[[],[],[]]],["coddle",["pamper or treat with excessive care"],[[],[],[]]],["crescendo",["the loudest or highest point of something"],[[],[],[]]],["extenuating",["lessening the seriousness by providing excuses"],[[],[],[]]],["frenetic",["fast-paced or wildly energetic"],[[],[],[]]],["fringe",["unconventional, extreme, or marginal"],[[],[],[]]],["hapless",["unlucky or unfortunate"],[[],[],[]]],["immaculate",["spotlessly clean or free from errors"],[[],[],[]]],["obfuscate",["obscure or confuse"],[[],[],[]]],["ossify",["harden or become unchanging"],[[],[],[]]],["pastiche",["a work that either imitates the style of multiple other works or combines elements from various works"],[[],[],[]]],["perspicacious",["keenly perceptive or understanding"],[[],[],[]]],["ponderous",["heavy or slow-moving, often due to weight; extremely dull"],[[],[],[]]],["recluse",["a person who lives in self-imposed isolation"],[[],[],["reclusive"]]],["retaliate",["take revenge or counteract"],[[],[],[]]],["rhapsody",["an ecstatic expression of feeling or enthusiasm"],[[],[],[]]],["serendipitous",["occurring by chance in a fortunate way"],[["serendipity"],[],[]]],["shirk",["avoid or neglect a responsibility or duty"],[[],[],[]]],["sinecure",["a job requiring minimal effort but offering a salary"],[[],[],[]]],["sinuous",["winding or having many smooth turns"],[[],[],[]]],["sordid",["involving ignoble actions and motives"],[[],[],[]]],["stanch",["stop or reduce the flow of"],[[],[],[]]],["surfeit",["an excessive amount of something"],[[],[],[]]],["ulterior",["concealed, typically with a hidden motive"],[[],[],[]]],["voluble",["speaking a lot, with great ease, often about unimportant matters"],[[],[],[]]]]},{"n":32,"w":[["abstruse",["difficult to comprehend or understand"],[[],[],[]]],["auxiliary",["supplementary or additional, often in support"],[[],[],[]]],["caricature",["exaggerate features for comedic or satirical effect"],[[],[],[]]],["depravity",["the state or condition of being depraved or morally corrupted"],[[],[],["depraved"]]],["dilettante",["a person with an amateur interest in the arts or a particular field"],[[],[],[]]],["effrontery",["insolent or bold behavior"],[[],[],[]]],["encroach",["intrude or trespass, especially on another’s territory or rights"],[[],[],[]]],["endow",["enrich or furnish with some faculty or quality"],[[],[],[]]],["entreat",["ask earnestly or anxiously; beg"],[["entreaty"],[],[]]],["gregarious",["sociable and enjoying the company of others"],[[],[],[]]],["indictment",["an official formal accusation for a criminal offense"],[[],[],[]]],["indignant",["feeling or expressing strong displeasure at something unjust or offensive"],[[],[],[]]],["ineluctable",["inescapable or inevitable"],[[],[],[]]],["inquisitive",["curious or eager to acquire knowledge"],[[],[],[]]],["latitude",["scope to do something; relative freedom from restrictions"],[[],[],[]]],["levity",["humor or lightness, especially when inappropriate"],[[],[],[]]],["malevolent",["showing ill will or wishing harm to others"],[["malevolence"],[],[]]],["mediate",["intervene between parties to bring about a resolution"],[["mediation"],[],[]]],["occlude",["block or stop up; cover"],[["occlusion"],[],[]]],["pacify",["bring peace to or calm someone down"],[[],[],[]]],["paragon",["a model of excellence or perfection"],[[],[],[]]],["patronize",["treat with an apparent kindness that is condescending","be a regular customer of a store or other establishment"],[[],[],[]]],["penurious",["extremely poor or stingy"],[["penury"],[],[]]],["piquant",["stimulating to the senses; engaging; charming"],[[],[],[]]],["rampant",["unrestrained or unchecked, usually in a negative manner"],[[],[],[]]],["remote",["not likely to happen"],[[],[],[]]],["reprobate",["a person who is immoral or who lacks principles"],[[],[],[]]],["turbid",["(of water) muddy or opaque due to suspended particles","unclear; confused; obscure"],[["turbidity"],[],[]]],["turgid",["swollen or bloated","overly complex and difficult to understand"],[[],[],[]]],["vacuous",["lacking intelligence or thought"],[[],[],[]]]]}];
const $=s=>document.querySelector(s);
const ALL=D.flatMap(g=>g.w.map(([w,m,f])=>({w,m,f,g:g.n})));
const MEAN={};ALL.forEach(e=>e.m.forEach(t=>{const k=t.toLowerCase();(MEAN[k]=MEAN[k]||[]).push(e.w.toLowerCase())}));
let S={groups:[1],mode:'type',speak:'on'};
try{Object.assign(S,JSON.parse(localStorage.getItem('vtS')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('vtS',JSON.stringify(S))}catch(e){}};
let pool=[],deck=[],Q=null,st={};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rnd=n=>Math.random()*n|0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function say(t){if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.volume=1;u.rate=.9;u.lang='en-US';speechSynthesis.speak(u)}catch(e){}}
const stopSay=()=>{try{speechSynthesis.cancel()}catch(e){}};

/* setup */
const MODES=[['type','Type the word'],['pick','Pick the meaning']];
const MH={type:'You see a meaning and type the word it describes (not case sensitive). Then you see its other forms.',pick:'You see a word and choose its meaning from up to 10 options, sorted A to Z. Needs at least 2 words.'};
const SH={on:'Type mode: the word is spoken after a correct answer. Pick mode: the word is spoken when it appears.',off:'Words are not spoken.'};
function seg(id,o){const el=$('#'+id);el.innerHTML='';o.forEach(([v,l])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.setAttribute('aria-pressed',String(S[id]===v));b.onclick=()=>{S[id]=v;save();ui()};el.appendChild(b)})}
function ui(){
  seg('mode',MODES);seg('speak',[['on','On'],['off','Off']]);
  const g=$('#gsel');g.innerHTML='';
  D.forEach(({n})=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.setAttribute('aria-label','Group '+n);b.setAttribute('aria-pressed',String(S.groups.includes(n)));
    b.onclick=()=>{const i=S.groups.indexOf(n);i<0?S.groups.push(n):S.groups.splice(i,1);save();ui()};g.appendChild(b)});
  const p=$('#gpre');p.innerHTML='';
  [['All',()=>D.map(x=>x.n)],['None',()=>[]],['Invert',()=>D.map(x=>x.n).filter(n=>!S.groups.includes(n))]].forEach(([l,f])=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.onclick=()=>{S.groups=f();save();ui()};p.appendChild(b)});
  const c=ALL.filter(e=>S.groups.includes(e.g)).length;
  $('#cnt').textContent='('+S.groups.length+' selected, '+c+' words)';
  $('#mhint').textContent=MH[S.mode];$('#shint').textContent=SH[S.speak];
  $('#start').disabled=c<(S.mode==='pick'?2:1);
}
function start(){
  pool=ALL.filter(e=>S.groups.includes(e.g));if(pool.length<(S.mode==='pick'?2:1))return;
  deck=[];st={ok:0,n:0,streak:0,round:0};
  $('#setup').hidden=true;$('#quiz').hidden=false;vc();next();
}
function back(){stopSay();$('#quiz').hidden=true;$('#setup').hidden=false;ui()}
function vc(){$('#vc').textContent='Voice: '+(S.speak==='on'?'On':'Off')}

/* quiz */
function stats(){
  $('#sOk').textContent=st.ok;$('#sStreak').textContent=st.streak;
  $('#sAcc').textContent=st.n?Math.round(100*st.ok/st.n)+'%':'–';
  const k=pool.length-deck.length;
  $('#sProg').textContent=k+'/'+pool.length;$('#sRound').textContent='Round '+Math.max(1,st.round);
  $('#prog').style.width=(100*k/pool.length)+'%';
}
function options(w,mean){
  const bad=new Set(w.m.map(x=>x.toLowerCase())),used=new Set([mean.toLowerCase()]),o=[{t:mean,ok:true}];
  for(const e of shuffle(pool.slice())){
    if(o.length>=10)break;if(e===w)continue;
    const t=e.m[rnd(e.m.length)],k=t.toLowerCase();
    if(bad.has(k)||used.has(k))continue;used.add(k);o.push({t,ok:false});
  }
  return o.sort((a,b)=>a.t.localeCompare(b.t,undefined,{sensitivity:'base',ignorePunctuation:true}));
}
function next(){
  if(!deck.length){deck=shuffle(pool.slice());st.round++}
  const w=deck.pop();Q={w,missed:false,done:false,hints:0,typed:''};
  $('#rev').hidden=true;$('#fb').textContent='';$('#note').textContent='';
  const t=S.mode==='type';$('#typeUI').hidden=!t;$('#opts').hidden=t;
  if(t){
    Q.mean=w.m[rnd(w.m.length)];Q.ok=new Set(MEAN[Q.mean.toLowerCase()]);
    $('#lab').textContent='Which word has this meaning?';
    $('#big').className='big';$('#big').textContent=Q.mean;
    if(w.m.length>1)$('#note').textContent='This word has '+w.m.length+' meanings. This is one of them.';
    const i=$('#inp');i.value='';i.disabled=false;i.classList.remove('bad');i.focus();
  }else{
    Q.opts=options(w,w.m[rnd(w.m.length)]);
    $('#lab').textContent='What does this word mean?';
    $('#big').className='big w';$('#big').textContent=w.w;
    const el=$('#opts');el.innerHTML='';
    Q.opts.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.innerHTML='<kbd>'+((i+1)%10)+'</kbd><span></span>';b.lastChild.textContent=o.t;b.onclick=()=>choose(i);el.appendChild(b)});
    if(S.speak==='on')say(w.w);
  }
  stats();
}
function miss(){if(!Q.missed){Q.missed=true;st.streak=0;stats()}}
function finish(){Q.done=true;st.n++;if(!Q.missed){st.ok++;st.streak++}else st.streak=0;stats();reveal()}
function check(){
  if(Q.done)return;const v=$('#inp').value.trim().toLowerCase();if(!v)return;
  if(Q.ok.has(v)){Q.typed=v;finish()}
  else{miss();const i=$('#inp');i.classList.remove('bad');void i.offsetWidth;i.classList.add('bad');$('#fb').textContent='Not quite. Try again, take a hint, or show the answer.'}
}
function hint(){
  if(Q.done)return;const w=Q.w.w;Q.hints=Math.min(Q.hints+1,w.length-1);miss();
  $('#fb').textContent=(w.slice(0,Q.hints)+'_'.repeat(w.length-Q.hints)).split('').join(' ')+'  ('+w.length+' letters)';
}
function giveUp(){if(Q.done)return;miss();finish()}
function choose(i){
  if(Q.done)return;const bs=$('#opts').children;
  if(Q.opts[i].ok){Q.opts.forEach((o,j)=>{bs[j].disabled=true;if(o.ok)bs[j].classList.add('ok')});finish()}
  else{bs[i].classList.add('bad');bs[i].disabled=true;miss()}
}
function reveal(){
  const w=Q.w;$('#rev').hidden=false;$('#inp').disabled=true;
  $('#rword').textContent=w.w;
  const ol=$('#rm');ol.className=w.m.length>1?'':'one';ol.innerHTML=w.m.map(m=>'<li>'+esc(m)+'</li>').join('');
  const L=['Noun','Verb','Adjective'];
  $('#rf').innerHTML=w.f.map((a,i)=>a.length?'<span><em>'+L[i]+'</em>'+esc(a.join(', '))+'</span>':'').join('');
  $('#rnote').textContent=(Q.typed&&Q.typed!==w.w.toLowerCase())?'You typed \u201c'+Q.typed+'\u201d, which shares this meaning. The listed word is \u201c'+w.w+'\u201d.':'';
  if(S.speak==='on'&&S.mode==='type')say(w.w);
  $('#next').focus();
}

/* events */
$('#start').onclick=start;$('#back').onclick=back;$('#next').onclick=next;
$('#chk').onclick=check;$('#hintb').onclick=hint;$('#give').onclick=giveUp;
$('#hear').onclick=()=>say(Q.w.w);
$('#vc').onclick=()=>{S.speak=S.speak==='on'?'off':'on';save();vc();if(S.speak==='off')stopSay()};
$('#inp').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});
document.addEventListener('keydown',e=>{
  if($('#quiz').hidden||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Escape'){back();return}
  if(!$('#rev').hidden){if(e.key==='Enter'){e.preventDefault();next()}return}
  if(S.mode==='pick'&&/^[0-9]$/.test(e.key)){const i=(+e.key+9)%10;if(i<Q.opts.length)choose(i)}
});
ui();
</script>
